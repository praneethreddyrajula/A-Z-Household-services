<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        background-color: #f8f9fa;
      }
      .signup-container {
        max-width: 500px;
        margin: 50px auto;
      }
      .card {
        padding: 20px;
        border-radius: 10px;
      }
      .btn-primary {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="signup-container">
        <div class="card shadow">
          <h2 class="text-center">Customer Signup</h2>
          <form method="post">
            <div class="mb-3">
              <label for="fullName" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="fullName" name="fullName" required>
            </div>
            <div class="mb-3">
              <label for="inputEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="inputEmail" name="inputEmail" required pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$">
            </div>
            <div class="mb-3">
              <label for="inputPassword" class="form-label">Password</label>
              <input type="password" id="inputPassword" class="form-control" name="inputPassword" required>
              <small class="form-text text-muted">Must be 8-20 characters long.</small>
            </div>
            <div class="mb-3">
              <label for="inputPhone" class="form-label">Phone Number</label>
              <input type="text" class="form-control" id="inputPhone" name="inputPhone" required>
            </div>
            <div class="mb-3">
              <label for="inputAddress" class="form-label">Address</label>
              <input type="text" class="form-control" id="inputAddress" name="inputAddress" required>
            </div>
            <div class="mb-3">
              <label for="inputZip" class="form-label">Pin Code</label>
              <input type="text" class="form-control" id="inputZip" name="inputZip" required>
            </div>
            <div class="mb-3 form-check">
              <input class="form-check-input" type="checkbox" id="gridCheck" required>
              <label class="form-check-label" for="gridCheck">I agree to the terms and conditions</label>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
          </form>
          <div class="text-center mt-3">
            <a class="btn btn-outline-secondary" href="/" role="button">Home</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
