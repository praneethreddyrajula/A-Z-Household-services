
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
      <h1>Professional Signup</h1>
      <form class="row g-3" method="post" enctype="multipart/form-data">
          <div class="col-md-5">
            <label for="inputEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="inputEmail" name="inputEmail" required pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$">
          </div>
          <div class="col-md-5">
            <label for="inputPassword" class="form-label">Password</label>
            <input type="password" id="inputPassword" class="form-control" aria-describedby="passwordHelpInline" name="inputPassword" required>
            <div class="col-auto">
              <span id="passwordHelpInline" class="form-text">
                Must be 8-20 characters long.
              </span>
            </div>
          </div>
          <div class="col-5">
            <label for="fullName" class="form-label">fullName</label>
            <input type="text" class="form-control" id="fullName" name="fullName" required>
          </div>
          <div class="col-5">
            <label for="inputAddress" class="form-label">Address</label>
            <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St, Apartment, studio, or floor" name="inputAddress" required>
          </div>
          <div class="col-md-3">
            <label for="inputZip" class="form-label">PinCode</label>
            <input type="text" class="form-control" id="inputZip" name="inputZip" required>
          </div>
          <div class="col-5">
            <label for="infoDoc" class="form-label">Document</label>
            <input type="file" class="form-control" id="infoDoc" name="infoDoc" required>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="gridCheck" required>
              <label class="form-check-label" for="gridCheck">
                Check me out
              </label>
            </div>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Register</button>
          </div>
        </form>
        <br>
        <div class="col-md-12">
          <a class="btn btn-primary btn-lg" href="/" role="button">Home</a>
        </div>
        
  </body>
</html>
